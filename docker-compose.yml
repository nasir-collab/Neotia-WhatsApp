version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anhvl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anhvl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anhvl_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-anhvl_engagement}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-anhvl_admin} -d ${POSTGRES_DB:-anhvl_engagement}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anhvl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: anhvl-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      PLATFORM_MODE: ${PLATFORM_MODE:-DEMO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-anhvl_admin}:${POSTGRES_PASSWORD:-anhvl_secure_password}@postgres:5432/${POSTGRES_DB:-anhvl_engagement}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-strong-64-byte-secret-in-production}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-anhvl-meta-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      HIS_API_BASE_URL: ${HIS_API_BASE_URL:-}
      HIS_API_KEY: ${HIS_API_KEY:-}
      ALTRUIST_API_BASE_URL: ${ALTRUIST_API_BASE_URL:-}
      ALTRUIST_API_KEY: ${ALTRUIST_API_KEY:-}
    ports:
      - '4000:4000'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/settings/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: anhvl-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'

volumes:
  pgdata:
  redisdata:

